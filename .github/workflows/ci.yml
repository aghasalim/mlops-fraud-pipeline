name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest

      # Unit + contract tests. The drift tests encode bugs that actually
      # shipped, so a regression on any of them blocks the build.
      - name: tests
        run: python -m pytest tests/ -q

      # Model gates. registry.py exits non-zero when any gate fails, so a model
      # below threshold cannot be promoted by re-running the job.
      - name: model gates
        id: gate
        run: |
          python -m src.pipeline.registry
          echo "deployable=true" >> "$GITHUB_OUTPUT"

  # Differential verification: the numbers in README.md and INCIDENT.md are
  # recomputed from reports/ by seven implementations that share no code, and
  # this fails if any two of them disagree. See README section 6.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sqlite3, gcc, go, cargo, node and java are on the runner already. R is
      # not, and the install is guarded so a future runner image that ships it
      # does not pay for this step.
      - name: R, if the runner does not have it
        run: |
          command -v Rscript || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          }

      - name: recompute every published number
        run: ./verify/verify.sh

      # A check that cannot fail is not a check.
      - name: the checks must reject a corrupted results file
        run: |
          sed -i 's/^5,44290,0.1,0.044,/5,44290,0.1,0.144,/' \
            reports/drift_vs_degradation.csv
          if git diff --quiet reports/drift_vs_degradation.csv; then
            echo "the corruption did not apply, so this proves nothing"
            exit 1
          fi
          if ./verify/verify.sh; then
            echo "the checks passed on a corrupted file, so they check nothing"
            exit 1
          fi
          git checkout -- reports/drift_vs_degradation.csv
          ./verify/verify.sh

  build:
    needs: test
    if: needs.test.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    env:
      # Interpolated into env rather than inlined into run:, which is the
      # correct habit even though github.sha is a hex commit id and not
      # attacker-controlled free text.
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # Only reached when tests AND gates pass -- the gate is a job dependency,
      # not a green check mark someone is trusted to read.
      - name: build image
        run: docker build -t "mlops-fraud-pipeline:$IMAGE_TAG" .
      - name: smoke-test the built image
        run: |
          docker run -d --name svc -p 8000:8000 "mlops-fraud-pipeline:$IMAGE_TAG"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "healthy"; break
            fi
            sleep 3
          done
          curl -sf -X POST http://localhost:8000/predict \
            -H 'content-type: application/json' \
            -d '{"TransactionAmt": 120.0}' | tee /dev/stderr | grep -q fraud_probability
          docker rm -f svc
